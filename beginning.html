<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Begin | MasterBaller</title>
  <link rel="stylesheet" href="beginning.css">
  <link rel="stylesheet" href="nav.css">
</head>

<body>
  <nav class="navbar">
    <a href="index.html" class="navbar__brand">MasterBaller</a>
  
    <button class="navbar__toggle"
        aria-label="Toggle menu"
        aria-expanded="false"
        aria-controls="primary-navigation">☰</button>
  
    <ul class="navbar__links" id="primary-navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="beginning.html" class="active" aria-current="page">Begin</a></li>
        <li><a href="volunteer.html">Volunteer</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="support.html">Support</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>

  <main class="content">
    <h1 class="title1">What can you achieve?</h1>
    <h2 class="title2">Enter Your Stats</h2>

    <form id="stats-form">
      <label for="sprint">How many seconds does it take you
        to sprint 30 meters?</label>
      <input id="sprint" name="sprint" type="number"
        step="0.01" min="0" class="input" required>

      <label for="distance">How far can you run in 6 minutes (in meters)?</label>
      <input id="distance" name="distance" type="number"
        min="0" class="input" required>

      <label for="dribbling">How many seconds does it take you
        to dribble through 6 cones spaced 2 meters apart?</label>
      <input id="dribbling" name="dribbling" type="number"
        step="0.01" min="0" class="input" required>

      <label for="passing">Out of 10 passes from 10 meters away,
        how many go through a 1-meter-wide target?</label>
      <input id="passing" name="passing" type="number"
        min="0" max="10" class="input" required>

      <label for="shooting">Out of 10 shots from 12 meters away,
        how many hit the target?</label>
      <input id="shooting" name="shooting" type="number"
        min="0" max="10" class="input" required>

      <label for="defending">In 10 one-on-one attempts,
        how many times do you stop your opponent?</label>
      <input id="defending" name="defending" type="number"
        min="0" max="10" class="input" required>

      <label for="interceptions">How many passes do you intercept
        during a 10-minute small-sided game?</label>
      <input id="interceptions" name="interceptions" type="number"
        min="0" class="input" required>

      <label for="possession">In 10 attempts, how many times can
        you keep the ball from a defender for 5 seconds?</label>
      <input id="possession" name="possession" type="number"
        min="0" max="10" class="input" required>

      <label for="goalkeeping">Out of 10 controlled shots,
        how many do you save?</label>
      <input id="goalkeeping" name="goalkeeping" type="number"
        min="0" max="10" class="input" required>

      <label for="communication">How many useful instructions
        do you give teammates during a 10-minute game?</label>
      <input id="communication" name="communication" type="number"
        min="0" class="input" required>

      <button type="submit" class="button submit">Submit</button>
    </form>
  </main>

  <script>
    // Mobile navigation menu
    const menuToggle = document.querySelector('.navbar__toggle');
    const navigation = document.querySelector('.navbar__links');
  
    menuToggle.addEventListener('click', () => {
      const isOpen = navigation.classList.toggle('is-open');
      menuToggle.setAttribute('aria-expanded', isOpen);
    });
  
    // Submit soccer stats to the AI coach
    const statsForm = document.getElementById('stats-form');
    const submitButton = statsForm.querySelector('.submit');
  
    statsForm.addEventListener('submit', async (event) => {
      event.preventDefault();
  
      if (!statsForm.reportValidity()) {
        return;
      }
  
      const formData = new FormData(statsForm);
      const stats = {};
  
      for (const [key, value] of formData.entries()) {
        stats[key] = Number(value);
      }
  
      // Prevent impossible or invalid measurements
      if (
        stats.sprint <= 0 ||
        stats.dribbling <= 0 ||
        stats.distance <= 0 ||
        stats.interceptions < 0 ||
        stats.communication < 0
      ) {
        alert('Please enter valid positive measurements and nonnegative counts.');
        return;
      }
  
      // Save the button's original text
      const originalText = submitButton.textContent;
  
      submitButton.disabled = true;
      submitButton.textContent = 'Analyzing Your Performance...';
  
      try {
        const response = await fetch('/api/coach', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(stats)
        });
  
        const result = await response.json();
  
        if (!response.ok) {
          throw new Error(
            result.error || 'Unable to analyze your stats right now.'
          );
        }
  
        // Store the results for the separate results page
        sessionStorage.setItem(
          'masterballerResults',
          JSON.stringify({
            analysis: result.analysis,
            stats: stats
          })
        );
  
        window.location.href = 'results.html';
  
      } catch (error) {
        console.error('AI coach error:', error);
  
        alert(
          error.message ||
          'Something went wrong. Please try again.'
        );
  
        submitButton.disabled = false;
        submitButton.textContent = originalText;
      }
    });
  </script>
</body>
</html>
