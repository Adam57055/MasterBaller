<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stats</title>
    <link rel="stylesheet" href="stats.css">
</head>
<body>
    <!-- From Uiverse.io by SelfMadeSystem --> 
<div class="nav">
    <div class="container">
      <div class="btn">Home</div>
      <div class="btn">Contact</div>
      <div class="btn">About</div>
      <div class="btn">FAQ</div>
      <svg
        class="outline"
        overflow="visible"
        width="400"
        height="60"
        viewBox="0 0 400 60"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect
          class="rect"
          pathLength="100"
          x="0"
          y="0"
          width="400"
          height="60"
          fill="transparent"
          stroke-width="5"
        ></rect>
      </svg>
    </div>
  </div>
  
    <div class="content">
        <h1 class="stats-headline">
            <span class="stats-headline__lead">Let's see your current</span>
            <span class="stats-headline__accent">skill...</span>
        </h1>
        <h2>Answer the following to the best of your ability.</h2>
        <p>How far can you run in one sitting?</p>
    </div>
</body>
</html>
